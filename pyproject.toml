[project]
name = "replay"
version = "0.1.0"
description = "A durable and replayable execution engine for AI agents"
license = "MIT"
readme = "README.md"
authors = [
    { name = "elif", email = "elifbarlik4@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
replay = "replay:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15.0",
]
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now" = { msg = "Use Clock instead." }
"uuid.uuid4" = { msg = "Use IdGen instead." }

[tool.ruff.lint.per-file-ignores]
"src/replay/clock.py" = ["TID251"]
"src/replay/idgen.py" = ["TID251"]

[tool.hatch.build.targets.wheel]
packages = ["src/replay"]

[tool.hatch.build.targets.wheel.force-include]
"src/replay/py.typed" = "replay/py.typed"