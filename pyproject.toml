[project]
name = "replay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "elif", email = "elifbarlik4@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.0",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
replay = "replay:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
